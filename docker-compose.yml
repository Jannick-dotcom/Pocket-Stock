services:
  pocket-stock:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_DIR: /data
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET in .env}
    volumes:
      - pocket_stock_data:/data
    expose:
      - "3000"
    networks:
      - pocketstock
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - pocket-stock
    networks:
      - pocketstock
volumes:
  pocket_stock_data:
  caddy_data:
  caddy_config:
networks:
  pocketstock:
